[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-streaming-lag-monitor"
version = "0.1.0"
description = "Offline lag analyzer for simplified OCI Streaming consumer snapshots"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
oci-streaming-lag-monitor = "oci_streaming_lag_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
